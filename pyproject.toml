[project]
name = "stock101"
version = "0.1.0"
description = "QQQ vs SPY research notebook: performance and risk metrics with unit tests."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jupyter>=1.0",
    "ipykernel>=6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
